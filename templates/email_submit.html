{% extends "base.html" %}
{% block content %}
<div class="card">
  <h2 style="margin-top:0">Submit Tasks</h2>
  <p>{{ count }} task(s) for {{ today }} ready to submit.</p>
  <p>Default emails: <strong>{{ emails or '(none set)' }}</strong></p>
  <button onclick="submitAndMail()" class="btn">Download CSV & Open Mail</button>
  <form method="post" action="{{ url_for('submit_confirm') }}" style="display:inline;margin-left:8px">
    <button type="submit" class="secondary">Mark as Submitted</button>
  </form>
  <p style="margin-top:16px;font-size:13px;color:#666">CSV will download, then your mail app opens with addresses filled. Attach the CSV and send.</p>
  <a href="{{ url_for('dashboard') }}" style="display:inline-block;margin-top:12px">Back</a>
</div>
<script>
function submitAndMail() {
  // Trigger CSV download
  window.location.href = "{{ url_for('download_csv') }}";
  // Open mail app after short delay
  setTimeout(function() {
    var emails = "{{ emails or '' }}";
    var subject = "ASF Tasks {{ session.user }} {{ today }}";
    var body = "Tasks attached for {{ today }}.";
    var mailto = "mailto:" + encodeURIComponent(emails) +
                 "?subject=" + encodeURIComponent(subject) +
                 "&body=" + encodeURIComponent(body);
    window.location.href = mailto;
  }, 800);
}
</script>
{% endblock %}
