{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:400px;margin:40px auto">
  <h2 style="margin-top:0;color:#2F5496">Change Password</h2>
  <p>You must set a new password before continuing.</p>
  <form method="post">
    <label>New Password</label>
    <input name="password" type="password" required minlength="4" autofocus>
    <button type="submit" style="margin-top:16px;width:100%">Update Password</button>
  </form>
</div>
{% endblock %}
